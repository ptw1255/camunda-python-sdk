[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camunda-python-sdk"
version = "0.1.0"
description = "Python SDK for Camunda 8+ — built for AI/ML engineers"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.3,<1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/camunda"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 99
